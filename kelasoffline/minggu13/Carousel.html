<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel Online Image</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">

<div class="carousel-inner">
<div class="carousel-item active">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" class="d-block w-100" style="height: 450px; object-fit: cover;">
</div>

<div class="carousel-item">
<img src="https://images.unsplash.com/photo-1495567720989-cebdbdd97913" class="d-block w-100" style="height: 450px; object-fit: cover;">
</div>

<div class="carousel-item">
<img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455" class="d-block w-100" style="height: 450px; object-fit: cover;">
</div>
</div>

<!-- Tombol Prev -->
<button class="carousel-control-prev"
type="button"
data-bs-target="#carouselExample"
data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>
<!-- Tombol Next -->
<button class="carousel-control-next"
type="button"
data-bs-target="#carouselExample"
data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
